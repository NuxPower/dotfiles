# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor= DP-1,preferred,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty 
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
exec-once = systemctl --user start xdg-desktop-portal.service
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service
exec-once = mako
exec-once = waybar
exec-once = swww-daemon
exec-once = swayosd-server
exec-once = sleep 1 && swww img /home/hanyu/Downloads/anm9990.jpg --transition-type wipe --transition-angle 30 --transition-step 90
exec-once = playerctld daemon 
#exec-once = sh -c 'sleep 20 && flatpak run com.spotify.Client'
exec-once = kdeconnectd
exec-once = gsettings set org.gnome.desktop.interface font-name 'Ubuntu Nerd Font Bold 10'
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = ~/.config/hypr/startup.sh
exec-once = gnome-keyring-daemon --start --components=secrets
#exec-once = /usr/bin/gnome-keyring-daemon --start --components=gpg,pkcs11,secrets,ssh
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
#exec-once = sh -c 'sleep 40 && ferdium --enable-features=UseOzonePlatform --ozone-platform=wayland'

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11,*

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = master 
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.9
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
   force_split = 0 
   preserve_split = true 
}

master {
    new_status = master
    mfact = 0.5
    orientation = right
}

##############################
### WINDOWS AND WORKSPACES ###
##############################
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1, on-created-empty:org.kde.falkon
workspace = 3, monitor:eDP-1, on-created-empty:ferdium
workspace = 4, monitor:eDP-1, on-created-empty:spotify 
workspace = 5, monitor:eDP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1
#workspace = 4, on-created-empty:spotify
# Use 'class' instead of 'initialClass' for better reliability in 0.53
windowrule = match:class ^org.kde.falkon, workspace 2 silent
windowrule = match:class ^ferdium$, workspace 3 silent
windowrule = match:class ^spotify$, workspace 4 silent
windowrule = match:class ^discord$, workspace 5 silent
windowrule = match:title ^Neovim$, workspace 6 
windowrule = match:class ^Antigravity$, workspace 7 silent
windowrule = match:class ^org.kde.dolphin$, workspace 9 silent
windowrule = match:title ^Navicat Premium$, workspace 8 
#windowrulev2 = workspace 2, class:^org.kde.falkon$
#windowrulev2 = workspace 3, class:^ferdium$
#windowrulev2 = workspace 4, class:^spotify$

# Kitty specific rules
windowrule = match:class ^(kitty)$ match:title ^(system_monitor)$, tile 1
windowrule = match:title ^(system_monitor)$, min_size 0 24
# This ensures your system_monitor title always tiles correctly
#windowrulev2 = tile, class:^(kitty)$, title:^(system_monitor)$
#windowrulev2 = tile, class:^(kitty)$, title:^(media_player)$
#windowrulev2 = minsize 0 24, title:^(system_monitor)$

# Global Fixes
windowrule = match:class .*, suppress_event maximize
#windowrulev2 = suppress_event maximize, class:.*

windowrule = match:class (envim), tile 1
windowrule = match:class (envim), opacity 0.95 0.90
#windowrulev2 = tile, class:(envim)
#windowrulev2 = opacity 0.95 0.90, class:(envim)

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 
    scroll_method = on_button_down
    scroll_button = 274
    scroll_factor = 3.0
    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, togglesplit, 

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, R, exec, pkill -SIGINT wf-recorder && notify-send "Recording" "Video saved" || (notify-send "Recording" "Started" && wf-recorder --audio=$(pactl get-default-sink).monitor -g "$(slurp)" -f ~/Videos/$(date +'%H-%M-%S').mp4)

bindl = , Caps_Lock, exec, swayosd-client --caps-lock && swayosd-client --caps-lock-status
# Screen brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
ecosystem {
    no_update_news = true
}
