# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor= DP-1,preferred,auto,1

monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty 
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
exec-once = systemctl --user start xdg-desktop-portal.service
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service
exec-once = swaync > /dev/null 2>&1
#exec-once = mako
exec-once = waybar
exec-once = swww-daemon
exec-once = swayosd-server
#exec-once = sleep 4 && swww img /home/hanyu/Downloads/anm9990.jpg --transition-type wipe --transition-angle 30 --transition-step 90
exec-once = ~/.config/hypr/swww-start.sh
exec-once = playerctld daemon 
exec-once = hyprpm reload -n
#exec-once = sh -c 'sleep 20 && flatpak run com.spotify.Client'
exec-once = kdeconnectd
exec-once = gsettings set org.gnome.desktop.interface font-name 'Ubuntu Nerd Font Bold 10'
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = ~/.config/hypr/startup.sh
exec-once = gnome-keyring-daemon --start --components=secrets
#exec-once = /usr/bin/gnome-keyring-daemon --start --components=gpg,pkcs11,secrets,ssh
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
#exec-once = sh -c 'sleep 40 && ferdium --enable-features=UseOzonePlatform --ozone-platform=wayland'
exec-once = /home/hanyu/.config/hypr/scripts/toggle_laptop_inputs.sh > /tmp/input_toggle.log 2>&1

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11,*
env = QTWEBENGINE_CHROMIUM_FLAGS,--disable-gpu --disable-gpu-compositing

env = GNOME_SHELL_SESSION_MODE,hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Active border matches your Dusty Rose
    col.active_border = rgba(b87d77ee) 
    # Inactive border uses a muted berry shadow for depth
    col.inactive_border = rgba(482d41aa) 
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.9
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1b2633)
    }

    blur {
        enabled = true
        size = 5
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
   force_split = 2 
   preserve_split = true 
   pseudotile = true
}

master {
    new_status = master
    mfact = 0.6
    orientation = bottom 
}

##############################
### WINDOWS AND WORKSPACES ###
##############################
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1, on-created-empty:zen
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1, on-created-empty:spotify 
workspace = 5, monitor:eDP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

workspace = special:hide, on-created-empty:true
#workspace = 4, on-created-empty:spotify
# Use 'class' instead of 'initialClass' for better reliability in 0.53
windowrule = match:class ^org.kde.falkon, workspace 2 silent
#windowrule = match:class ^ferdium$, workspace 3 silent
windowrule = match:class ^spotify$, workspace 4 silent
windowrule = match:class ^discord$, workspace 5 silent
windowrule = match:title ^Neovim$, workspace 6 
windowrule = match:class ^antigravity$, workspace 7 silent
windowrule = match:class ^org.kde.dolphin$, workspace 9 silent
windowrule = match:title ^Navicat Premium$, workspace 8 
windowrule = match:title ^google-chrome$, workspace 0
#windowrulev2 = workspace 2, class:^org.kde.falkon$
#windowrulev2 = workspace 3, class:^ferdium$
#windowrulev2 = workspace 4, class:^spotify$

# Kitty specific rules
# windowrule = match:class ^(kitty)$ match:title ^(system_monitor)$, tile 1
# windowrule = match:title ^(system_monitor)$, min_size 0 24
windowrule = match:class ^(kitty)$ match:title ^(shell)$, max_size 600 400 
# This ensures your system_monitor title always tiles correctly
#windowrulev2 = tile, class:^(kitty)$, title:^(system_monitor)$
#windowrulev2 = tile, class:^(kitty)$, title:^(media_player)$
#windowrulev2 = minsize 0 24, title:^(system_monitor)$

# Global Fixes
windowrule = match:class .*, suppress_event maximize
#windowrulev2 = suppress_event maximize, class:.*

windowrule = match:class (envim), tile 1
windowrule = match:class (envim), opacity 0.95 0.90
#windowrulev2 = tile, class:(envim)
#windowrulev2 = opacity 0.95 0.90, class:(envim)
# Calculated for your 1366x768 display
# Width: ~640px (little less than half of 1366)
# Height: ~340px (little less than half of 768)

# Workspace 1 Sizing Rules
# windowrule = match:title ^(system_monitor)$, min_size 600 400
# windowrule = match:title ^(clock)$, min_size 600 150

# Ensure they don't float by accident
windowrule = match:title ^(system_monitor)$, tile 1
windowrule = match:title ^(clock)$, tile 1
windowrule = match:class ^microsoft-edge.*, match:title ^$, float on
windowrule = match:class ^microsoft-edge.*, match:title ^$, no_initial_focus on
windowrule = match:class ^xwaylandvideobridge$, opacity 0.0 override
windowrule = match:class ^xwaylandvideobridge$, no_anim on
windowrule = match:class ^xwaylandvideobridge$, no_initial_focus on
windowrule = match:class ^xwaylandvideobridge$, no_blur on
windowrule = match:class ^$, match:title ^$, float on
windowrule = match:class ^$, match:title ^$, no_initial_focus on
# windowrule = match:title ^(music|system_monitor|clock|shell)$, min_size 300 300
# windowrule = match:title ^(system_monitor)$, min_size 300 350

# Correct syntax for newer Hyprland versions
# Use the exact namespace found in hyprctl layers
layerrule = blur true,match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5,match:namespace swaync-notification-window
misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
    size_limits_tiled = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 
    scroll_method = on_button_down
    scroll_button = 274
    scroll_factor = 1.5
    emulate_discrete_scroll = 0
    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, togglesplit, 

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Super + Middle Click (Scroll Wheel Press) to capture area, save, and copy
bind = $mainMod, mouse:274, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy
# Capture selected area -> Save to Pictures + Copy to Clipboard
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/$(date +%Y%m%d_%H%M%S).png | wl-copy

# Capture active monitor only -> Save to Pictures + Copy to Clipboard
# (Uses jq to identify the focused monitor so you don't get both screens)
bind = SHIFT, Print, exec, grim -o $(hyprctl monitors -j | jq -r '.[] | select(.focused) | .name') - | tee ~/Pictures/Full_$(date +%Y%m%d_%H%M%S).png | wl-copy
#bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy
#bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, R, exec, pkill -SIGINT wf-recorder && notify-send "Recording" "Video saved" || (notify-send "Recording" "Started" && wf-recorder --audio=$(pactl get-default-sink).monitor -g "$(slurp)" -f ~/Videos/$(date +'%H-%M-%S').mp4)
bind = $mainMod, B, exec, killall -SIGUSR1 waybar
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, D, exec, ~/dotfiles/system/bin/show_desktop.sh
# Bind Alt+Tab to the 3D switcher
bind = alt, tab, hyprexpo:expo, toggle

bindl = , Caps_Lock, exec, swayosd-client --caps-lock && swayosd-client --caps-lock-status
# Screen brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
ecosystem {
    no_update_news = true
}

device {
    name = at-translated-set-2-keyboard
    enabled = true
}

device {
    name = etps/2-elantech-touchpad
    enabled = true
}

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(b87d77) # Dusty Rose
        workspace_method = center current 
    }
}

