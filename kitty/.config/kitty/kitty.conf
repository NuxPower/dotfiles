# --- Font ---
font_family      JetBrainsMono Nerd Font
font_size        9.0

# --- Window Padding ---
window_padding_width 5
placement_strategy   center

allow_remote_control yes
listen_on unix:/tmp/mykitty

# --- Aesthetics ---
# This allows the pink wallpaper to bleed through slightly
background_opacity         0.65
dynamic_background_opacity yes
confirm_os_window_close    0

# --- Dusty Rose / 818292.jpg Colors ---
# Darker text for high contrast on light backgrounds
foreground            #482d41
# A very light, desaturated rose/lavender background
background            #fdf6f7
# Using your Dusty Rose for the cursor
cursor                #b87d77
selection_background  #f7a8b8
selection_foreground  #ffffff

# --- Fix for Contrast (Darker ANSI colors) ---

# Standard Colors
color0  #482d41
color8  #8c6c7c

# Red (Dusty Rose) - Darkened for readability
color1  #b87d77
color9  #d68d87

# Green - Darkened so 'nvim' and file paths are visible
color2  #5a7346
color10 #718f58

# Blue - Darkened for your prompt segments
color4  #3d5a80
color12 #5a7da3

# Magenta/Purple
color5  #896a98
color13 #b392c4

# Cyan
color6  #4a8985
color14 #71b3af

# White/Foreground
foreground  #482d41
background  #fdf6f7
