# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  col.active_border = $color12 $color15 45deg
  col.inactive_border = $color10
}

decoration {
  rounding = 12
  
  active_opacity = 1.0
  inactive_opacity = 0.92
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.07
  dim_special = 0.8

  shadow {
    enabled = true
    range = 8
    render_power = 2

    color = $shadow_active
    color_inactive = $shadow_inactive
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
