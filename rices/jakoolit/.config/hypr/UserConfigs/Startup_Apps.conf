# Commands and Apps to be executed at launch

# Raise hovered floating windows after a short, calm dwell.
exec-once = $HOME/.config/hypr/scripts/FloatRaiseOnHover.sh

# Desktop widget on workspace 1 (greeting/clock/weather/stats).
# Runs as a systemd unit so Refresh.sh's `pkill qs` can't permanently kill it.
exec-once = systemctl --user start deskwidget.service

# Dark local animation; managed player, no scripts or network.
exec-once = $HOME/.local/bin/live-wallpaper start

# Restore positions and supported rates for the active laptop.
exec-once = $HOME/.local/bin/monitor-layout restore
