# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

windowrule = match:title ^Neovim$, workspace 6 
windowrule = match:class ^antigravity$, workspace 7 silent
windowrule = match:class ^thunar$, workspace 9 silent
windowrule = match:title ^Navicat Premium$, workspace 8


# Custom Webcam Window Rules (Modern Hyprland Syntax)
# Custom Webcam Window Rules (Strict Hyprland v0.53+ Syntax)
windowrule = float 1, match:title "^(Webcam Feed)$"
windowrule = size 640 480, match:title "^(Webcam Feed)$"
windowrule = center 1, match:title "^(Webcam Feed)$"
windowrule = pin 1, match:title "^(Webcam Feed)$"
windowrule = dim_around 1, match:title "^(Webcam Feed)$"

# swaync control center: slide in from the right edge, blur panel background
layerrule = match:namespace swaync-control-center, animation slide right
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
