# Dual-monitor layout: external on the LEFT, laptop on the RIGHT.
# Matched by description because connector names change between boots
# (seen as eDP-1/eDP-2 and HDMI-A-1/HDMI-A-2).
# Laptop is 2560x1600 @ scale 2 = 1280x800 logical; y=280 bottom-aligns it
# with the 1080-tall external so the bottom waybars line up.
# NOTE: nwg-displays / MonitorProfiles.sh overwrite this file. A copy lives in
# Monitor_Profiles/Dual-ExtLeft.conf.

monitor = desc:HKC OVERSEAS LIMITED G2411P 0000000000001, 1920x1080@200, 0x0, 1
monitor = desc:EDO EF10QBC64.C, 2560x1600@165, 1920x280, 2

# Anything else that gets plugged in
monitor = , preferred, auto, 1
