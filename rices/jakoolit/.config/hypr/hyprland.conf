# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Always refer to Hyprland wiki
# https://wiki.hyprland.org/

# Initial boot script enable to apply initial wallpapers, theming, new settings etc.
# suggest not to change this or delete this including deleting referrence file in ~/.config/hypr/.initial_startup_done
# as long as the referrence file is present, this initial-boot.sh will not execute
exec-once = $HOME/.config/hypr/initial-boot.sh

### Sourcing external config files ###
$configs = $HOME/.config/hypr/configs # Default Configs directory path
$UserConfigs = $HOME/.config/hypr/UserConfigs # User Configs directory path

source=$configs/Keybinds.conf # Pre-configured keybinds

# Load defaults, then user additions/overrides
source= $configs/Startup_Apps.conf 
source= $UserConfigs/Startup_Apps.conf

source= $configs/ENVariables.conf # Environment variables (defaults)
source= $UserConfigs/ENVariables.conf # Environment variables (user)

# For laptop related
source= $configs/Laptops.conf 
source= $UserConfigs/Laptops.conf 
source= $UserConfigs/LaptopDisplay.conf 

# Load defaults, then user additions
source= $configs/WindowRules.conf # Window Rules and Layer Rules (defaults)
source= $UserConfigs/WindowRules.conf # Window Rules and Layer Rules (user)

source= $configs/SystemSettings.conf # Default config for hypr 

source= $UserConfigs/UserDecorations.conf # Decorations config file
source= $UserConfigs/UserAnimations.conf # Animation config file
source= $UserConfigs/UserKeybinds.conf # Put your own keybinds here
source= $UserConfigs/UserSettings.conf # Main Hyprland Settings.
source= $UserConfigs/01-UserDefaults.conf # settings for User defaults apps

# nwg-displays
source= $HOME/.config/hypr/monitors.conf
source= $HOME/.config/hypr/workspaces.conf

# Workspaces 1-5: laptop; all higher numbered workspaces: external monitor.
# Match display descriptions so connector names can change between boots.
workspace = 1, monitor:desc:AU Optronics 0x71EC, default:true
workspace = 2, monitor:desc:AU Optronics 0x71EC, on-created-empty:zen
workspace = 3, monitor:desc:AU Optronics 0x71EC
workspace = 4, monitor:desc:AU Optronics 0x71EC
workspace = 5, monitor:desc:AU Optronics 0x71EC
workspace = 6, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001, default:true
workspace = 7, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 8, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 9, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 10, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001, on-created-empty:spotify
workspace = 11, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 12, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 13, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 14, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
workspace = 15, monitor:desc:HKC OVERSEAS LIMITED G2411P 0000000000001
# Route newly created higher-numbered workspaces and handle monitor reconnection.
exec-once = python3 $HOME/.config/hypr/scripts/WorkspaceMonitors.py

# --- Hide windows from screen share (tag:noshare) ---
windowrule = no_screen_share = true, match:tag = noshare
windowrule = border_color rgb(f38ba8), match:tag = noshare




# Windscribe floating fix
windowrule = float 1, match:class ^(Windscribe|windscribe)$
windowrule = size 360 620, match:class ^(Windscribe|windscribe)$
